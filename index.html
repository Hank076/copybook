<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>中文注音練字帖產生器</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fffefa'/%3E%3Cpath d='M7 8h18v18H7zM16 8v18M7 17h18' fill='none' stroke='%232b3a42' stroke-width='1.6'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='14' font-family='serif' fill='%23d75043'%3E字%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="workspace-panel" aria-label="練字帖設定">
        <header class="brand-panel">
          <p class="eyebrow">A4 注音練字帖</p>
          <h1>中文注音練字帖產生器</h1>
          <p>輸入要練習的中文字，調整格線、注音與描紅樣式後，即時產生可列印的正式教材版面。</p>
        </header>

        <section class="panel-card" aria-labelledby="step-input" data-od-id="input-panel">
          <div class="section-heading">
            <span class="step-mark">1</span>
            <div>
              <h2 id="step-input">輸入練習內容</h2>
              <p>換行與標點會自動略過，只保留中文字練習格。</p>
            </div>
          </div>

          <label class="field">
            <span>要練習的字詞</span>
            <textarea id="textInput" rows="6">陳韋程
上下左右
日月山水</textarea>
          </label>
        </section>

        <section class="panel-card" aria-labelledby="step-style" data-od-id="style-panel">
          <div class="section-heading">
            <span class="step-mark">2</span>
            <div>
              <h2 id="step-style">調整字帖樣式</h2>
              <p>設定會立即反映到右側 A4 預覽。</p>
            </div>
          </div>

          <fieldset>
            <legend>格線樣式</legend>
            <div class="segmented">
              <label><input type="radio" name="grid" value="tian" checked><span>田字格</span></label>
              <label><input type="radio" name="grid" value="mi"><span>米字格</span></label>
              <label><input type="radio" name="grid" value="blank"><span>空白格</span></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>顯示模式</legend>
            <div class="segmented ink-modes">
              <label><input type="radio" name="ink" value="trace" checked><span>紅字描紅</span></label>
              <label><input type="radio" name="ink" value="read"><span>黑字閱讀</span></label>
              <label><input type="radio" name="ink" value="outline"><span>鏤空填充</span></label>
              <label><input type="radio" name="ink" value="hide"><span>空白練習</span></label>
            </div>
          </fieldset>

          <label class="switch">
            <input id="bpmfToggle" type="checkbox" checked>
            <span>顯示注音</span>
          </label>

          <div class="control-grid">
            <label class="field">
              <span>字體大小 <output id="fontSizeValue">46</output>px</span>
              <input id="fontSize" type="range" min="34" max="62" value="46">
            </label>

            <label class="field">
              <span>每列字數</span>
              <input id="columnCount" type="number" min="4" max="8" value="6">
            </label>

            <label class="field">
              <span>每字重複格數</span>
              <input id="repeatCount" type="number" min="1" max="12" value="5">
            </label>
          </div>
        </section>

        <section class="panel-card action-card" aria-labelledby="step-print" data-od-id="print-panel">
          <div class="section-heading">
            <span class="step-mark">3</span>
            <div>
              <h2 id="step-print">預覽與列印</h2>
              <p>列印時只輸出右側 A4 字帖，不會印出設定面板。</p>
            </div>
          </div>

          <div class="actions">
            <button id="renderButton" class="secondary-button" type="button">更新預覽</button>
            <button id="printButton" class="primary-button" type="button">列印 / 存 PDF</button>
          </div>

          <p id="status" class="status" role="status">正在載入注音資料...</p>
        </section>
      </aside>

      <section class="preview-stage" aria-label="練字帖預覽" data-od-id="preview-stage">
        <div class="preview-toolbar" aria-label="預覽摘要">
          <div>
            <p class="eyebrow">即時預覽</p>
            <h2>正式教材 A4 版面</h2>
          </div>
          <dl class="preview-stats">
            <div>
              <dt>練習字數</dt>
              <dd id="characterCount">0</dd>
            </div>
            <div>
              <dt>總格數</dt>
              <dd id="cellCount">0</dd>
            </div>
            <div>
              <dt>每列</dt>
              <dd><span id="columnCountValue">6</span> 字</dd>
            </div>
          </dl>
        </div>

        <div id="sheetFrame" class="sheet-frame">
          <div id="sheetFit" class="sheet-fit">
            <article id="sheet" class="sheet">
              <header class="sheet-header">
                <div>
                  <p>中華民國（臺灣）教育部標準楷體</p>
                  <h2>中文硬筆字注音練習</h2>
                </div>
                <dl>
                  <div><dt>姓名</dt><dd></dd></div>
                  <div><dt>日期</dt><dd></dd></div>
                </dl>
              </header>
              <div id="grid" class="grid" aria-live="polite"></div>
            </article>
          </div>
        </div>
      </section>
    </main>

    <script src="copybook-core.js"></script>
    <script src="datas/phonic_table_Z.js"></script>
    <script src="app.js"></script>
  </body>
</html>
